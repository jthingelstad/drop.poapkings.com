AWSTemplateFormatVersion: "2010-09-09"
Description: Elixir Drop web application and API

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  SessionSecret:
    Type: String
    NoEcho: true
  TelemetryPepper:
    Type: String
    NoEcho: true
    Description: Server-only pepper for referee connection-correlation HMACs. Lambda env only; never exposed to the referee scripts, referee role, CI, or the browser.
  FastmailJmapToken:
    Type: String
    NoEcho: true
  ButtondownApiKey:
    Type: String
    NoEcho: true
    Default: ""
  ButtondownNewsletterId:
    Type: String
    Default: ""
  TinylyticsApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Full-access API token used only by the API Lambda to publish authoritative Tinylytics events.
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
  WebOriginToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Private CloudFront origin marker used to trust the viewer IP forwarded to the API.
  WebCertificateArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$
    Description: ARN of the us-east-1 ACM certificate for drop.poapkings.com.
  AppUrl:
    Type: String
    Default: https://drop.poapkings.com
  EmailFrom:
    Type: String
    Default: elixir@poapkings.com
  AlarmEmail:
    Type: String
    Default: drop@poapkings.com
  MailCanaryEmail:
    Type: String
    Default: drop@poapkings.com
  NameModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  WebVersion:
    Type: String
    Default: ""
    Description: Current front-end build id (git sha); the API reports it so stale tabs can prompt a reload.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://drop.poapkings.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: elixir-drop
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse tag-cluster index: only tagged PROFILE items carry GSI2 keys
        # (GSI2PK = "TAGGED", GSI2SK = "{normalizedPlayerTag}#{playerId}"), so
        # referee-tags can group accounts by tag without a table scan. A single
        # "TAGGED" partition is fine at beta scale. Projects only the
        # pseudonymous playerId — never sub or email.
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - playerId
        # Public player lookup by the pseudonymous profile UUID. Only public
        # profile fields are projected beyond DynamoDB's internal base keys;
        # email stays off-index and no storage key crosses the API boundary.
        - IndexName: GSI3
          KeySchema:
            - AttributeName: playerId
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - publicName
              - favoriteCardId
              - playerTag
              - totalGames
              - xp
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CrRequestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-drop-cr-requests-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CrRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-drop-cr-requests
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CrRequestDeadLetterQueue.Arn
        maxReceiveCount: 5

  CrResultDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-drop-cr-results-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CrResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-drop-cr-results
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CrResultDeadLetterQueue.Arn
        maxReceiveCount: 5

  CrBridgeHeartbeatPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: elixir-drop-cr-bridge-heartbeat
      Users:
        - elixir-drop-cr-bridge
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: ElixirDrop/CRBridge

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elixir-drop-alarms
      DisplayName: Elixir Drop Alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # The execution role is bootstrap-owned rather than stack-owned. Its current
  # policy already permits bounded iam:PutRolePolicy calls on elixir-drop-*
  # roles, so an existing production stack can grant this new dashboard-only
  # capability before CloudFormation creates the dashboard below. Fresh
  # environments also receive the same permission directly from bootstrap.mjs.
  CloudFormationDashboardPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: elixir-drop-dashboard-management
      Roles:
        - elixir-drop-cloudformation-execution
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:DeleteDashboards
              - cloudwatch:GetDashboard
              - cloudwatch:PutDashboard
            Resource: !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/elixir-drop-*

  # Existing production execution roles predate the share bucket. The role is
  # already allowed to manage bounded policies on elixir-drop-* roles, so this
  # stack-owned bridge grants the exact new bucket before CloudFormation creates
  # it. Bootstrap writes the same scope for fresh environments.
  CloudFormationShareAssetPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: elixir-drop-share-asset-management
      Roles:
        - elixir-drop-cloudformation-execution
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::elixir-drop-share-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:s3:::elixir-drop-share-${AWS::AccountId}-${AWS::Region}/*

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/api
      RetentionInDays: 30

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/api-access
      RetentionInDays: 30

  CrResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/cr-results
      RetentionInDays: 30

  MailCanaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/mail-canary
      RetentionInDays: 30

  WebAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/web-access
      LogGroupClass: STANDARD
      RetentionInDays: 14
      ResourcePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontVendedLogs
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/elixir-drop/web-access:log-stream:*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
      Tags:
        - Key: application
          Value: elixir-drop

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-api-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-api-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Both Lambdas are pinned to managed log groups via
              # LoggingConfig, so no CreateLogGroup and no wildcard resource.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt ApiLogGroup.Arn
                  - !GetAtt CrResultLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub "${DataTable.Arn}/index/*"
              # Scoped to the configured Haiku inference profile plus the
              # Anthropic foundation models it routes to — not Resource: "*".
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${NameModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CrRequestQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CrResultQueue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ShareAssetBucket.Arn}/run-images/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ShareAssetBucket.Arn}/badge-images/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ShareAssetBucket.Arn}/profile-images/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ShareAssetBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - run-images/*
                      - badge-images/*
                      - profile-images/*

  MailCanaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-mail-canary-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-mail-canary-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt MailCanaryLogGroup.Arn

  # Referee identity for evidence review and reversible run judgments. It reads
  # the canonical evidence surface — bounded to the partitions and indexes the
  # AGENT-TEAM referee scripts address — and may write only REFEREE# decision
  # partitions; it cannot alter players, runs, scores, evidence, or leaderboard
  # index rows, and has NO access to any secret (the pepper is Lambda-only).
  # The physical name is retained for compatibility with the managed host's
  # existing AWS profile even though the role is no longer strictly read-only.
  RefereeReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-referee-read
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-referee-bounded
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Keyed reads stay inside the three partition families the referee
              # scripts actually address: PLAYER# (the profile's playerId, RUN#
              # history, EVIDENCE# items), REFEREE# (its own decisions), and the
              # CR_WAR_CLOCK singleton that carries the current leaderboard
              # season. MAGIC# (raw email), POLL# (session envelopes), RATE#,
              # RUN#, CR_PLAYER#, and FEED# are out of reach.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - PLAYER#*
                      - REFEREE#*
                      - CR_WAR_CLOCK
              # Index reads: the GSI1 leaderboard partitions and the sparse GSI2
              # tag clusters (playerId-only projection). dynamodb:LeadingKeys
              # cannot bound these — an index query keys on the index's own
              # partition key, not the table's — so the bound is the resource
              # itself: GSI3 (the public profile lookup) and any index added
              # later are not granted.
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !Sub "${DataTable.Arn}/index/GSI1"
                  - !Sub "${DataTable.Arn}/index/GSI2"
              # Scan cannot be partition-bounded: it returns items regardless of
              # the leading key, so DynamoDB does not evaluate
              # dynamodb:LeadingKeys for it. Four referee reads need it (runId ->
              # evidence, playerId -> owning profile, the unscored-attempt feed,
              # and the decision list), so it is granted on the base table only —
              # never an index — and paired with the attribute Deny below.
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DataTable.Arn
              # Golden rule 7 in IAM rather than in JS: no referee read may name
              # a subject or email attribute in a projection, filter, or key —
              # the identity half of the scripts' own forbidden-key list. Key
              # attributes (pk, GSI1SK) are deliberately absent: DynamoDB needs
              # them for pagination and index reads, and the scripts strip them
              # from output instead. This closes the deliberate-projection path.
              # A Query/Scan that supplies no ProjectionExpression still returns
              # whole items, so stripForbidden() remains the other half of the
              # guarantee; requiring dynamodb:Select SPECIFIC_ATTRIBUTES would
              # close that too, but every referee Scan today reads whole
              # evidence items.
              - Effect: Deny
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub "${DataTable.Arn}/index/*"
                Condition:
                  ForAnyValue:StringEquals:
                    dynamodb:Attributes:
                      - sub
                      - playerSub
                      - owner
                      - email
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - REFEREE#*

  # Failure-report intake is deliberately separate from player accounts and
  # Fair Play evidence. Run Drop can query and triage only the RUN_REPORTS
  # partition; the reports themselves contain no player identity, token, raw
  # request header, or transcript.
  RunReportsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-run-reports
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/elixir-drop
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-run-reports-bounded
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - RUN_REPORTS
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - RUN_REPORTS

  # Private account-administration identity for the tailnet-only Drop Control
  # service. This is deliberately separate from RefereeReadRole: referee
  # evidence remains pseudonymous, while this role can project the small set of
  # account and CR snapshot fields Jamie needs for support. It cannot read
  # magic links, sessions, run/evidence bodies, scores, or secrets, and its only
  # write is an atomic public-profile correction plus an immutable CONTROL#
  # audit event. Email is readable for support but absent from the write list.
  DropControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-control
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/elixir-drop
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-control-bounded
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DataTable.Arn
                Condition:
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - playerId
                      - email
                      - publicName
                      - favoriteCardId
                      - playerTag
                      - totalGames
                      - xp
                      - createdAt
                      - updatedAt
                      - lastLoginAt
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - CR_PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - tag
                      - status
                      - name
                      - clan
                      - accountAge
                      - cards
                      - fetchedAt
                      - refreshRequestedAt
                      - updatedAt
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - CONTROL#PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - playerId
                      - changedFields
                      - before
                      - after
                      - reason
                      - operator
                      - changedAt
                      - schemaVersion
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - PLAYER#*
                      - CONTROL#PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - playerId
                      - publicName
                      - favoriteCardId
                      - playerTag
                      - GSI2PK
                      - GSI2SK
                      - updatedAt
                      - changedFields
                      - before
                      - after
                      - reason
                      - operator
                      - changedAt
                      - schemaVersion

  # Narrow write identity for leaderboard projection repair. It may scan the
  # table and update only the sparse GSI attributes on PLAYER# items; canonical
  # runs, scores, profiles, XP, and referee evidence are outside its attribute
  # allowlist. The deploy user assumes it explicitly for dry-run-first scripts.
  LeaderboardMaintenanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-leaderboard-maintenance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/elixir-drop
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-leaderboard-maintenance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DataTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - GSI1PK
                      - GSI1SK

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: elixir-drop-api
      Description: Elixir Drop authentication, profiles, runs, and leaderboards
      Architectures:
        - arm64
      Runtime: nodejs24.x
      Handler: handler.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 512
      Timeout: 20
      # Caps concurrent spend if something hammers the API past the stage
      # throttle; generous for beta-scale traffic.
      ReservedConcurrentExecutions: 25
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ApiLogGroup
        SystemLogLevel: INFO
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          SESSION_SECRET: !Ref SessionSecret
          TELEMETRY_PEPPER: !Ref TelemetryPepper
          FASTMAIL_JMAP_TOKEN: !Ref FastmailJmapToken
          BUTTONDOWN_API_KEY: !Ref ButtondownApiKey
          BUTTONDOWN_NEWSLETTER_ID: !Ref ButtondownNewsletterId
          TINYLYTICS_API_TOKEN: !Ref TinylyticsApiToken
          APP_URL: !Ref AppUrl
          ELIXIR_DROP_EMAIL_FROM: !Ref EmailFrom
          ELIXIR_DROP_EMAIL_FROM_NAME: Elixir Drop
          NAME_MODEL_ID: !Ref NameModelId
          ELIXIR_DROP_DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          ELIXIR_DROP_WEB_ORIGIN_TOKEN: !Ref WebOriginToken
          CR_REQUEST_QUEUE_URL: !Ref CrRequestQueue
          SHARE_ASSET_BUCKET: !Ref ShareAssetBucket
          WEB_VERSION: !Ref WebVersion

  CrResultFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: elixir-drop-cr-results
      Description: Stores normalized Clash Royale player and Clan Wars clock results from the fixed-IP bridge
      Architectures:
        - arm64
      Runtime: nodejs24.x
      Handler: handler.crResultHandler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 5
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref CrResultLogGroup
        SystemLogLevel: INFO
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          SESSION_SECRET: !Ref SessionSecret
          # The result consumer does not write referee evidence, but it calls the
          # shared getConfig(), which requires TELEMETRY_PEPPER. Present here only
          # to satisfy that shared config; still Lambda-only, never exported.
          TELEMETRY_PEPPER: !Ref TelemetryPepper
          FASTMAIL_JMAP_TOKEN: !Ref FastmailJmapToken
          APP_URL: !Ref AppUrl
          ELIXIR_DROP_EMAIL_FROM: !Ref EmailFrom
          ELIXIR_DROP_EMAIL_FROM_NAME: Elixir Drop
          NAME_MODEL_ID: !Ref NameModelId
          ELIXIR_DROP_DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          CR_REQUEST_QUEUE_URL: !Ref CrRequestQueue

  MailCanaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: elixir-drop-mail-canary
      Description: Submits a daily email through the player magic-link delivery path
      Architectures:
        - arm64
      Runtime: nodejs24.x
      Handler: handler.mailCanaryHandler
      Role: !GetAtt MailCanaryRole.Arn
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref MailCanaryLogGroup
        SystemLogLevel: INFO
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FASTMAIL_JMAP_TOKEN: !Ref FastmailJmapToken
          ELIXIR_DROP_EMAIL_FROM: !Ref EmailFrom
          ELIXIR_DROP_EMAIL_FROM_NAME: Elixir Drop
          ELIXIR_DROP_CANARY_EMAIL: !Ref MailCanaryEmail

  MailCanarySchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Submit one Elixir Drop email delivery canary each day
      ScheduleExpression: cron(0 13 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt MailCanaryFunction.Arn
          Id: elixir-drop-mail-canary
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 2

  MailCanaryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MailCanaryFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MailCanarySchedule.Arn

  CrResultEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CrResultQueue.Arn
      FunctionName: !Ref CrResultFunction
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures

  EstimatedChargesAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-estimated-charges
      AlarmDescription: >-
        Account-wide estimated AWS charges passed the monthly comfort ceiling.
        Requires billing alerts to be enabled once in the account (Billing
        preferences → Receive CloudWatch billing alerts); the metric only
        exists in us-east-1.
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-errors
      AlarmDescription: Elixir Drop API returned one or more HTTP 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: $default
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  WebDistributionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-drop-web-5xx-rate
      AlarmDescription: CloudFront returned more than 5% 5xx responses in two of three five-minute windows.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref WebDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiLatencyP95Alarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-latency-p95
      AlarmDescription: Elixir Drop API p95 response latency exceeded 1.2 seconds in two of three five-minute windows.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: $default
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiLatencyP99Alarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-latency-p99
      AlarmDescription: Elixir Drop API p99 response latency exceeded 2 seconds in two of three five-minute windows.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: $default
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiFunctionConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-concurrency
      AlarmDescription: Elixir Drop API used at least 20 of its 25 reserved concurrent executions in two of three minutes.
      Namespace: AWS/Lambda
      MetricName: ConcurrentExecutions
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DataTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-dynamodb-throttles
      AlarmDescription: Elixir Drop DynamoDB reads or writes were throttled in two of three minutes.
      Metrics:
        - Id: readthrottles
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: writethrottles
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: throttles
          Expression: readthrottles + writethrottles
          Label: DynamoDB throttle events
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DataTableSystemErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-dynamodb-system-errors
      AlarmDescription: DynamoDB returned service errors for Elixir Drop in two of three minutes.
      Metrics:
        - Id: batchget
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: BatchGetItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: batchwrite
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: BatchWriteItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: deleteitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: DeleteItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: getitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: GetItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: putitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: PutItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: query
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: Query
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: transactwrite
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: TransactWriteItems
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: updateitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: UpdateItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: systemerrors
          Expression: SUM(METRICS())
          Label: DynamoDB system errors
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-throttles
      AlarmDescription: Elixir Drop API Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  MailCanaryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-mail-canary-errors
      AlarmDescription: The daily Elixir Drop email delivery canary failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MailCanaryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  MailCanaryMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-mail-canary-missing
      AlarmDescription: The scheduled Elixir Drop email delivery canary has not run for two days.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref MailCanaryFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic

  CrResultFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-cr-result-errors
      AlarmDescription: The Clash Royale result consumer returned one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CrResultFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrRequestDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-cr-request-dlq
      AlarmDescription: A Clash Royale player refresh request reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CrRequestDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrResultDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-cr-result-dlq
      AlarmDescription: A Clash Royale player or Clan Wars clock result reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CrResultDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrBridgeBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-cr-bridge-backlog
      AlarmDescription: The fixed-IP bridge has not processed its oldest request within five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CrRequestQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrBridgeHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn:
      - AlarmTopic
      - CrBridgeHeartbeatPolicy
    Properties:
      AlarmName: elixir-drop-cr-bridge-heartbeat
      AlarmDescription: The fixed-IP bridge has stopped reporting its heartbeat.
      Namespace: ElixirDrop/CRBridge
      MetricName: Heartbeat
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic

  CrWarClockHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn:
      - AlarmTopic
      - CrBridgeHeartbeatPolicy
    Properties:
      AlarmName: elixir-drop-cr-war-clock-heartbeat
      AlarmDescription: The fixed-IP bridge has not successfully relayed the Clan Wars clock for fifteen minutes.
      Namespace: ElixirDrop/CRBridge
      MetricName: WarClockHeartbeat
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: elixir-drop-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 86400

  ApiIntegration:
