      AuthorizationType: NONE
      RouteKey: HEAD /share-assets/{playerTag}
      Target: !Sub integrations/${ApiIntegration}

  ShareRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /shares/{token}
      Target: !Sub integrations/${ApiIntegration}

  LeaderboardsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /leaderboards
      Target: !Sub integrations/${ApiIntegration}

  SeasonsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /seasons
      Target: !Sub integrations/${ApiIntegration}

  ActivityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /activity
      Target: !Sub integrations/${ApiIntegration}

  StatsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /stats
      Target: !Sub integrations/${ApiIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","integrationStatus":"$context.integration.status","responseLength":"$context.responseLength"}
      # A hard ceiling on request volume: beta-scale traffic sits far below
      # this, and a script hammering the unauthenticated routes hits the
      # throttle instead of an unbounded Lambda + DynamoDB bill.
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    DependsOn: CloudFormationDashboardPolicy
    Properties:
      DashboardName: elixir-drop-operations
      DashboardBody: !Sub |
        {
          "start": "-PT8H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "alarm",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 5,
              "properties": {
                "title": "Elixir Drop service alarms",
                "sortBy": "stateUpdatedTimestamp",
                "alarms": [
                  "${WebDistributionErrorAlarm.Arn}",
                  "${ApiFunctionErrorAlarm.Arn}",
                  "${ApiFunctionThrottleAlarm.Arn}",
                  "${ApiLatencyP95Alarm.Arn}",
                  "${ApiLatencyP99Alarm.Arn}",
                  "${ApiFunctionConcurrencyAlarm.Arn}",
                  "${DataTableThrottleAlarm.Arn}",
                  "${DataTableSystemErrorAlarm.Arn}"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 5,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API requests and responses",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", "Stage", "$default", {"label": "Requests"}],
                  [".", "4xx", ".", ".", ".", ".", {"label": "4xx"}],
                  [".", "5xx", ".", ".", ".", ".", {"label": "5xx"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 5,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API response latency",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", "Stage", "$default", {"stat": "p50", "label": "p50"}],
                  [".", ".", ".", ".", ".", ".", {"stat": "p95", "label": "p95"}],
                  [".", ".", ".", ".", ".", ".", {"stat": "p99", "label": "p99"}],
                  [".", "IntegrationLatency", ".", ".", ".", ".", {"stat": "p95", "label": "Integration p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 11,
              "width": 24,
              "height": 7,
              "properties": {
                "title": "Requests by API route",
                "region": "${AWS::Region}",
                "period": 300,
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [{"expression": "SEARCH('{AWS/ApiGateway,ApiId,Stage,Method,Resource} MetricName=\"Count\" ApiId=\"${HttpApi}\" Stage=\"$default\"', 'Sum', 300)", "id": "route_requests"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 24,
              "height": 7,
              "properties": {
                "title": "p95 latency by API route",
                "region": "${AWS::Region}",
                "period": 300,
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [{"expression": "SEARCH('{AWS/ApiGateway,ApiId,Stage,Method,Resource} MetricName=\"Latency\" ApiId=\"${HttpApi}\" Stage=\"$default\"', 'p95', 300)", "id": "route_latency"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 25,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda request health",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}", {"label": "Invocations"}],
                  [".", "Errors", ".", ".", {"label": "Errors"}],
                  [".", "Throttles", ".", ".", {"label": "Throttles"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 25,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda duration and concurrency",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", {"stat": "p50", "label": "Duration p50"}],
                  [".", ".", ".", ".", {"stat": "p95", "label": "Duration p95"}],
                  [".", ".", ".", ".", {"stat": "p99", "label": "Duration p99"}],
                  [".", "ConcurrentExecutions", ".", ".", {"stat": "Maximum", "label": "Concurrency", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 31,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "DynamoDB consumed capacity",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DataTable}", {"label": "Read units"}],
                  [".", "ConsumedWriteCapacityUnits", ".", ".", {"label": "Write units"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 31,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "DynamoDB failures",
                "region": "${AWS::Region}",
                "period": 60,
                "stat": "Sum",
                "metrics": [
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${DataTable}", {"label": "Read throttles"}],
                  [".", "WriteThrottleEvents", ".", ".", {"label": "Write throttles"}],
                  [".", "SystemErrors", ".", ".", "Operation", "GetItem", {"label": "Get errors"}],
                  [".", ".", ".", ".", ".", "Query", {"label": "Query errors"}],
                  [".", ".", ".", ".", ".", "UpdateItem", {"label": "Update errors"}],
                  [".", ".", ".", ".", ".", "TransactWriteItems", {"label": "Transaction errors"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 37,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Web requests and bytes",
                "region": "us-east-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/CloudFront", "Requests", "DistributionId", "${WebDistribution}", "Region", "Global", {"label": "Requests"}],
                  [".", "BytesDownloaded", ".", ".", ".", ".", {"label": "Bytes", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 37,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Web error rate",
                "region": "us-east-1",
                "period": 300,
                "stat": "Average",
                "yAxis": {"left": {"label": "Percent", "showUnits": false}},
                "metrics": [
                  ["AWS/CloudFront", "TotalErrorRate", "DistributionId", "${WebDistribution}", "Region", "Global", {"label": "Total"}],
                  [".", "4xxErrorRate", ".", ".", ".", ".", {"label": "4xx"}],
                  [".", "5xxErrorRate", ".", ".", ".", ".", {"label": "5xx"}]
                ]
              }
            }
          ]
        }

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub elixir-drop-web-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Permanent derived preview images live outside WebBucket so the static web
  # deploy's mirror-and-delete step can never remove a player's published run.
  # Versioning is intentionally omitted: account deletion must remove the
  # derived image itself, not leave a retained object version behind.
  ShareAssetBucket:
    Type: AWS::S3::Bucket
    DependsOn: CloudFormationShareAssetPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub elixir-drop-share-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Private access from the Elixir Drop distribution to its web bucket
        Name: elixir-drop-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: elixir-drop-request-router
      AutoPublish: true
      FunctionConfig:
        Comment: Classify requests, route clean shares, strip the API prefix, and resolve static directory indexes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        import cf from 'cloudfront';

        function requestClass(uri) {
          if (uri.indexOf('/api/') === 0) return 'api';
          if (uri.indexOf('/share-assets/') === 0) return 'share-asset';
          if (uri.indexOf('/share/') === 0) return 'share-page';
          if (uri === '/auth' || uri === '/auth/') return 'web-auth-recovery';
          if (uri === '/' || uri === '/index.html') return 'web-home';

          var pageClasses = {
            '/about/': 'web-page-about',
            '/badges/': 'web-page-badges',
            '/discord/': 'web-page-discord',
            '/elixir-costs/': 'web-page-elixir-costs',
            '/faq/': 'web-page-faq',
            '/fair-play/': 'web-page-fair-play',
            '/games/': 'web-page-games',
            '/install/': 'web-page-install',
            '/learn-elixir-costs/': 'web-page-learn-elixir-costs',
            '/privacy/': 'web-page-privacy',
            '/updates/': 'web-page-updates',
            '/xp/': 'web-page-xp'
          };
          var pageUri = uri.replace(/index\.html$/, '');
          if (pageClasses[pageUri]) return pageClasses[pageUri];
          if (uri.indexOf('/assets/') === 0) return 'web-asset';
          if (uri.indexOf('/cards/') === 0) return 'web-card-art';
          if (uri === '/card-art-sw.js') return 'web-service-worker';
          if (uri === '/site.webmanifest') return 'web-manifest';
          if (uri === '/api-config.json' || uri === '/version.json') return 'web-config';
          if (uri === '/feed.xml' || uri === '/robots.txt' || uri === '/sitemap.xml') return 'web-discovery';
          return 'web-other';
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          cf.logCustomData(requestClass(uri));
          // Some desktop mail clients strip a URL fragment while opening the
          // magic link. Recover the resulting clean path at the edge so the
          // private S3 origin never sees a missing /auth object, and move the
          // token back into the fragment before the app loads.
          if (uri === '/auth' || uri === '/auth/') {
            var query = request.rawQueryString();
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: {
                'cache-control': { value: 'no-store' },
                'location': { value: '/#/auth' + (query === undefined ? '' : '?' + query) }
              }
            };
          }
          if (uri.indexOf('/api/') === 0 || uri.indexOf('/share/') === 0 || uri.indexOf('/share-assets/') === 0) {
            request.headers['x-elixir-drop-viewer-ip'] = { value: event.viewer.ip };
          }
          if (uri.indexOf('/api/') === 0) {
            request.uri = uri.slice(4) || '/';
            return request;
          }
          if (uri.indexOf('/share/') === 0 || uri.indexOf('/share-assets/') === 0) return request;
          if (uri === '/') {
            request.uri = '/index.html';
          } else if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: elixir-drop-static
        Comment: Honor web asset cache headers without varying on viewer state
        DefaultTTL: 3600
        MinTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - drop.poapkings.com
        CacheBehaviors:
          - PathPattern: /share-assets/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /share/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /api/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
        Comment: Elixir Drop website and same-origin API
        DefaultCacheBehavior:
          TargetOriginId: web
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref WebCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebRequestFunction.FunctionARN
          ResponseHeadersPolicyId: e61eb60c-9c35-4d20-a928-2b84e02af89c
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Elixir-Drop-Origin
                HeaderValue: !Ref WebOriginToken
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref WebCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: application
          Value: elixir-drop

  WebAccessLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: elixir-drop-web-access
      LogType: ACCESS_LOGS
      ResourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}
      Tags:
        - Key: application
          Value: elixir-drop

  WebAccessLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: elixir-drop-web-access
      DestinationResourceArn: !GetAtt WebAccessLogGroup.Arn
      OutputFormat: json
      Tags:
        - Key: application
          Value: elixir-drop

  WebAccessLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn: WebAccessLogDeliverySource
    Properties:
      DeliverySourceName: elixir-drop-web-access
      DeliveryDestinationArn: !GetAtt WebAccessLogDeliveryDestination.Arn
      RecordFields:
        - "timestamp(ms)"
        - x-edge-location
        - cs-method
        - sc-status
        - sc-bytes
        - x-edge-result-type
        - x-edge-response-result-type
        - x-edge-detailed-result-type
        - time-taken
        - time-to-first-byte
        - sc-content-type
        - cache-behavior-path-pattern
        - viewer-request-log-data
      Tags:
        - Key: application
          Value: elixir-drop

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  TableName:
    Value: !Ref DataTable
  FunctionName:
    Value: !Ref ApiFunction
  WebBucketName:
    Value: !Ref WebBucket
  ShareAssetBucketName:
    Value: !Ref ShareAssetBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  WebDistributionDomainName:
    Value: !GetAtt WebDistribution.DomainName
  WebAccessLogGroupName:
    Value: !Ref WebAccessLogGroup
  CrRequestQueueUrl:
    Value: !Ref CrRequestQueue
  CrResultQueueUrl:
    Value: !Ref CrResultQueue
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  RefereeReadRoleArn:
    Value: !GetAtt RefereeReadRole.Arn
    Description: Bounded referee role for evidence reads and REFEREE# decision writes.
  RunReportsRoleArn:
    Value: !GetAtt RunReportsRole.Arn
    Description: Bounded Run Drop role for identity-free failure-report triage.
  DropControlRoleArn:
    Value: !GetAtt DropControlRole.Arn
    Description: Tailnet-only account support role with audited public-profile corrections.
  LeaderboardMaintenanceRoleArn:
    Value: !GetAtt LeaderboardMaintenanceRole.Arn
    Description: Bounded role for sparse leaderboard projection repair.
