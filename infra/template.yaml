AWSTemplateFormatVersion: "2010-09-09"
Description: Elixir Drop web application and API

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  WebCodeKey:
    Type: String
  ApiVersion:
    Type: String
    Default: ""
  SessionSecret:
    Type: String
    NoEcho: true
  TelemetryPepper:
    Type: String
    NoEcho: true
    Description: Server-only pepper for referee connection-correlation HMACs. Lambda env only; never exposed to the referee scripts, referee role, CI, or the browser.
  UpdatesPublishToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Server-only bearer token used by the fixed host to publish player Updates without an AWS session.
  ElixirIntegrationKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: REST-audience platform credential. Stage before the API code cutover; the legacy MCP key is preserved for rollback.
  ElixirMcpKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Service token for the Elixir MCP hub. Drop reads recorded Clash Royale history from the hub. Not the Clash Royale token, which never leaves the allowlisted host.
  ElixirMcpBaseUrl:
    Type: String
    Default: https://elixir.poapkings.com
  ElixirOAuthClientId:
    Type: String
    Default: ""
    Description: Sign in with Elixir. The OAuth client_id Elixir issued to Drop (infra/scripts/register-elixir-client.mjs). Empty disables the button. A registration lives 365 days from last use.
  ElixirOAuthClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: The client secret for ElixirOAuthClientId, sent as client_secret on the token request (client_secret_post). Staged from the fixed host's .env; never printed. Empty sends none.
  WebCertificateArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$
    Description: ARN of the us-east-1 ACM certificate for drop.poapkings.com.
  AppUrl:
    Type: String
    Default: https://drop.poapkings.com
  AlarmEmail:
    Type: String
    Default: drop@poapkings.com
  NameModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  WebVersion:
    Type: String
    Default: ""
    Description: Current front-end build id (git sha); the API reports it so stale tabs can prompt a reload.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://drop.poapkings.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

Conditions:
  HasElixirIntegrationKey: !Not [!Equals [!Ref ElixirIntegrationKey, ""]]
  HasElixirMcpKey: !Not [!Equals [!Ref ElixirMcpKey, ""]]
  HasElixirOAuthClientId: !Not [!Equals [!Ref ElixirOAuthClientId, ""]]
  HasElixirOAuthClientSecret: !Not [!Equals [!Ref ElixirOAuthClientSecret, ""]]
  HasWebVersion: !Not [!Equals [!Ref WebVersion, ""]]
  HasApiVersion: !Not [!Equals [!Ref ApiVersion, ""]]

Resources:
  CloudFormationWebFunctionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: elixir-drop-web-function-management
      Roles: [elixir-drop-cloudformation-execution]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              [
                lambda:CreateWebFunction,
                lambda:DeleteWebFunction,
                lambda:GetWebFunction,
                lambda:ListWebFunctions,
                lambda:CreateWebFunctionRevision,
                lambda:DeleteWebFunctionRevision,
                lambda:GetWebFunctionRevision,
                lambda:ListWebFunctionRevisions,
                lambda:CreateWebFunctionEndpoint,
                lambda:UpdateWebFunctionEndpoint,
                lambda:DeleteWebFunctionEndpoint,
                lambda:GetWebFunctionEndpoint,
                lambda:ListWebFunctionEndpoints,
                lambda:TagResource,
                lambda:UntagResource,
                lambda:ListTagsForResource,
              ]
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/elixir-drop-web-api
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/elixir-drop-web-api/*
          - Effect: Allow
            Action:
              [s3:GetBucketPolicy, s3:PutBucketPolicy, s3:DeleteBucketPolicy]
            Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}

  WebCodeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: CloudFormationWebFunctionPolicy
    Properties:
      Bucket: !Ref CodeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/web/*
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/elixir-drop-web-api/*
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              [
                !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}",
                !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/*",
              ]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  WebPolicyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/web-policy
      RetentionInDays: 30

  WebPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-web-policy-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-web-origin-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  [
                    lambda:GetResourcePolicy,
                    lambda:PutResourcePolicy,
                    lambda:DeleteResourcePolicy,
                  ]
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/elixir-drop-web-api
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WebPolicyLogGroup.Arn

  WebPolicyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: elixir-drop-web-policy
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: web-policy.handler
      Role: !GetAtt WebPolicyRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref WebPolicyLogGroup
        LogFormat: JSON

  ApiOriginPolicy:
    Type: Custom::WebFunctionOriginPolicy
    Properties:
      ServiceToken: !GetAtt WebPolicyFunction.Arn
      ResourceArn: !GetAtt ApiWebFunction.FunctionArn
      EndpointArn: !GetAtt ApiWebEndpoint.EndpointArn
      DistributionArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: elixir-drop-web-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: elixir-drop-api-authorization
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false

  PublicApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: elixir-drop-public-api-authorization
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false

  ApiLatencyMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '{ $.message.event = "api.timings" }'
      MetricTransformations:
        - MetricNamespace: ElixirDrop/HTTP
          MetricName: RequestLatency
          MetricValue: $.message.elapsedMs
          Unit: Milliseconds

  CrResultRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-cr-results-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-season-repair
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CrResultLogGroup.Arn
              - Effect: Allow
                Action:
                  [
                    sqs:ReceiveMessage,
                    sqs:DeleteMessage,
                    sqs:GetQueueAttributes,
                  ]
                Resource: !GetAtt CrResultQueue.Arn
              - Effect: Allow
                Action:
                  [
                    dynamodb:ConditionCheckItem,
                    dynamodb:BatchGetItem,
                    dynamodb:GetItem,
                    dynamodb:Query,
                    dynamodb:PutItem,
                    dynamodb:UpdateItem,
                    dynamodb:TransactWriteItems,
                  ]
                Resource:
                  [!GetAtt DataTable.Arn, !Sub "${DataTable.Arn}/index/*"]

  ApiLocalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/api.local
      RetentionInDays: 30

  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: elixir-drop
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse tag-cluster index: only tagged PROFILE items carry GSI2 keys
        # (GSI2PK = "TAGGED", GSI2SK = "{normalizedPlayerTag}#{playerId}"), so
        # referee-tags can group accounts by tag without a table scan. A single
        # "TAGGED" partition is fine at beta scale. Projects only the
        # pseudonymous playerId — never sub or email.
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - playerId
        # Public player lookup by the pseudonymous profile UUID. Only public
        # profile fields are projected beyond DynamoDB's internal base keys;
        # email stays off-index and no storage key crosses the API boundary.
        - IndexName: GSI3
          KeySchema:
            - AttributeName: playerId
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - publicName
              - favoriteCardId
              - playerTag
              - totalGames
              - xp
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # The bridge is retired; this pair survives as the season-repair
  # channel only. podium-finalize is a manual command with no producer in
  # the repo, and it is the last thing that rides this queue.
  CrResultDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-drop-cr-results-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CrResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-drop-cr-results
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CrResultDeadLetterQueue.Arn
        maxReceiveCount: 5

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elixir-drop-alarms
      DisplayName: Elixir Drop Alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # A topic policy REPLACES the default one, so the account-owner statement
  # SNS would have written is restated. (A second statement let SES publish
  # sign-in mail events until Drop's sender retired on 2026-10-12.)
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: owner
            Effect: Allow
            Principal: { AWS: "*" }
            Action:
              [
                SNS:Publish,
                SNS:Subscribe,
                SNS:Receive,
                SNS:GetTopicAttributes,
                SNS:SetTopicAttributes,
                SNS:ListSubscriptionsByTopic,
                SNS:AddPermission,
                SNS:RemovePermission,
                SNS:DeleteTopic,
              ]
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: { AWS:SourceOwner: !Ref AWS::AccountId }

  # The execution role is bootstrap-owned rather than stack-owned. Its current
  # policy already permits bounded iam:PutRolePolicy calls on elixir-drop-*
  # roles, so an existing production stack can grant this new dashboard-only
  # capability before CloudFormation creates the dashboard below. Fresh
  # environments also receive the same permission directly from bootstrap.mjs.
  CloudFormationDashboardPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: elixir-drop-dashboard-management
      Roles:
        - elixir-drop-cloudformation-execution
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:DeleteDashboards
              - cloudwatch:GetDashboard
              - cloudwatch:PutDashboard
            Resource: !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/elixir-drop-*

  # Existing production execution roles predate the share bucket. The role is
  # already allowed to manage bounded policies on elixir-drop-* roles, so this
  # stack-owned policy grants the exact new bucket before CloudFormation creates
  # it. Bootstrap writes the same scope for fresh environments.
  CloudFormationShareAssetPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: elixir-drop-share-asset-management
      Roles:
        - elixir-drop-cloudformation-execution
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::elixir-drop-share-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:s3:::elixir-drop-share-${AWS::AccountId}-${AWS::Region}/*

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/api
      RetentionInDays: 30

  CrResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/cr-results
      RetentionInDays: 30

  WebAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/web-access
      LogGroupClass: STANDARD
      RetentionInDays: 14
      ResourcePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontVendedLogs
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/elixir-drop/web-access:log-stream:*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-api-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-api-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RefreshQueue.Arn
              # Web logging needs both managed regional and central groups.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt ApiLogGroup.Arn
                  - !GetAtt ApiLocalLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub "${DataTable.Arn}/index/*"
              # Scoped to the configured Haiku inference profile plus the
              # Anthropic foundation models it routes to — not Resource: "*".
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${NameModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ShareAssetBucket.Arn}/run-images/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ShareAssetBucket.Arn}/badge-images/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ShareAssetBucket.Arn}/profile-images/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ShareAssetBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - run-images/*
                      - badge-images/*
                      - profile-images/*

  # Referee identity for evidence review and reversible run judgments. It reads
  # the canonical evidence surface — bounded to the partitions and indexes the
  # scripts/referee-*.mjs address — and may write only REFEREE# decision
  # partitions; it cannot alter players, runs, scores, evidence, or leaderboard
  # index rows, and has NO access to any secret (the pepper is Lambda-only).
  # The physical name is retained for compatibility with the managed host's
  # existing AWS profile even though the role is no longer strictly read-only.

  RefereeReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-referee-read
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-referee-bounded
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Keyed reads stay inside the three partition families the referee
              # scripts actually address: PLAYER# (the profile's playerId, RUN#
              # history, EVIDENCE# items), REFEREE# (its own decisions), and the
              # CR_WAR_CLOCK singleton that carries the current leaderboard
              # season. MAGIC# (raw email), POLL# (session envelopes), RATE#,
              # RUN#, CR_PLAYER#, and FEED# are out of reach.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - PLAYER#*
                      - REFEREE#*
                      - CR_WAR_CLOCK
              # Index reads: the GSI1 leaderboard partitions and the sparse GSI2
              # tag clusters (playerId-only projection). dynamodb:LeadingKeys
              # cannot bound these — an index query keys on the index's own
              # partition key, not the table's — so the bound is the resource
              # itself: GSI3 (the public profile lookup) and any index added
              # later are not granted.
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !Sub "${DataTable.Arn}/index/GSI1"
                  - !Sub "${DataTable.Arn}/index/GSI2"
              # Scan cannot be partition-bounded: it returns items regardless of
              # the leading key, so DynamoDB does not evaluate
              # dynamodb:LeadingKeys for it. Four referee reads need it (runId ->
              # evidence, playerId -> owning profile, the unscored-attempt feed,
              # and the decision list), so it is granted on the base table only —
              # never an index — and paired with the attribute Deny below.
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DataTable.Arn
              # Golden rule 7 in IAM rather than in JS: no referee read may name
              # a subject or email attribute in a projection, filter, or key —
              # the identity half of the scripts' own forbidden-key list. Key
              # attributes (pk, GSI1SK) are deliberately absent: DynamoDB needs
              # them for pagination and index reads, and the scripts strip them
              # from output instead. This closes the deliberate-projection path.
              # A Query/Scan that supplies no ProjectionExpression still returns
              # whole items, so stripForbidden() remains the other half of the
              # guarantee; requiring dynamodb:Select SPECIFIC_ATTRIBUTES would
              # close that too, but every referee Scan today reads whole
              # evidence items.
              - Effect: Deny
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub "${DataTable.Arn}/index/*"
                Condition:
                  ForAnyValue:StringEquals:
                    dynamodb:Attributes:
                      - sub
                      - playerSub
                      - owner
                      - dropSub
                      - email
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - REFEREE#*

  # Failure-report intake is deliberately separate from player accounts and
  # Fair Play evidence. Run Drop can query and triage only the RUN_REPORTS
  # partition; the reports themselves contain no player identity, token, raw
  # request header, or transcript.
  RunReportsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-run-reports
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/elixir-drop
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-run-reports-bounded
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - RUN_REPORTS
              - Effect: Allow
                # DynamoDB authorizes each operation inside TransactWriteItems
                # against its corresponding item action as well as the
                # transaction API. Triage uses exactly one Update + one Put.
                Action:
                  - dynamodb:PutItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - RUN_REPORTS

  # Private account-administration identity for the tailnet-only Drop Control
  # service. This is deliberately separate from RefereeReadRole: referee
  # evidence remains pseudonymous, while this role can project the small set of
  # account and CR snapshot fields Jamie needs for support. It cannot read
  # magic links, sessions, run/evidence bodies, scores, or secrets, and its only
  # write is an atomic public-profile correction plus an immutable CONTROL#
  # audit event. Email is readable for support but absent from the write list.
  # (The grants Drop's retired newsletter backfill used went with it on
  # 2026-10-12.)
  DropControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-control
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/elixir-drop
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-control-bounded
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DataTable.Arn
                Condition:
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - playerId
                      - email
                      - publicName
                      - favoriteCardId
                      - playerTag
                      - totalGames
                      - xp
                      - createdAt
                      - updatedAt
                      - lastLoginAt
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - CR_PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - tag
                      - status
                      - name
                      - clan
                      - accountAge
                      - cards
                      - fetchedAt
                      - refreshRequestedAt
                      - updatedAt
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - CONTROL#PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - playerId
                      - changedFields
                      - before
                      - after
                      - reason
                      - operator
                      - changedAt
                      - schemaVersion
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - PLAYER#*
                      - CONTROL#PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - playerId
                      - publicName
                      - favoriteCardId
                      - playerTag
                      - GSI2PK
                      - GSI2SK
                      - updatedAt
                      - changedFields
                      - before
                      - after
                      - reason
                      - operator
                      - changedAt
                      - schemaVersion

  # Narrow write identity for leaderboard projection repair. It may scan the
  # table and update only the sparse GSI attributes on PLAYER# items; canonical
  # runs, scores, profiles, XP, and referee evidence are outside its attribute
  # allowlist. The deploy user assumes it explicitly for dry-run-first scripts.
  LeaderboardMaintenanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-drop-leaderboard-maintenance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/elixir-drop
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-drop-leaderboard-maintenance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt DataTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - PLAYER#*
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - GSI1PK
                      - GSI1SK

  ApiWebFunction:
    Type: AWS::Lambda::WebFunction
    DependsOn: CloudFormationWebFunctionPolicy
    Properties:
      FunctionName: elixir-drop-web-api
      Tags:
        - Key: Project
          Value: elixir-drop
        - Key: Environment
          Value: production

  ApiWebRevision:
    Type: AWS::Lambda::WebFunctionRevision
    DependsOn: [ApiWebFunction, WebCodeBucketPolicy, ApiLocalLogGroup]
    Properties:
      FunctionName: elixir-drop-web-api
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref CodeBucket
            Key: !Ref WebCodeKey
        RuntimeConfig:
          Runtime: nodejs24.x
      ServiceConfig:
        ExecutionRoleArn: !GetAtt ApiRole.Arn
        TimeoutSeconds: 20
        MaxConcurrencyPerEnvironment: 8
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref ApiLogGroup
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO
        EnvironmentVariables:
          TABLE_NAME: !Ref DataTable
          REFRESH_QUEUE_URL: !Ref RefreshQueue
          SESSION_SECRET: !Ref SessionSecret
          TELEMETRY_PEPPER: !Ref TelemetryPepper
          ELIXIR_DROP_UPDATES_PUBLISH_TOKEN: !Ref UpdatesPublishToken
          APP_URL: !Ref AppUrl
          NAME_MODEL_ID: !Ref NameModelId
          ELIXIR_INTEGRATION_KEY:
            !If [
              HasElixirIntegrationKey,
              !Ref ElixirIntegrationKey,
              !Ref AWS::NoValue,
            ]
          ELIXIR_MCP_KEY:
            !If [HasElixirMcpKey, !Ref ElixirMcpKey, !Ref AWS::NoValue]
          ELIXIR_MCP_BASE_URL: !Ref ElixirMcpBaseUrl
          ELIXIR_OAUTH_CLIENT_ID:
            !If [
              HasElixirOAuthClientId,
              !Ref ElixirOAuthClientId,
              !Ref AWS::NoValue,
            ]
          ELIXIR_OAUTH_CLIENT_SECRET:
            !If [
              HasElixirOAuthClientSecret,
              !Ref ElixirOAuthClientSecret,
              !Ref AWS::NoValue,
            ]
          SHARE_ASSET_BUCKET: !Ref ShareAssetBucket
          WEB_VERSION: !If [HasWebVersion, !Ref WebVersion, !Ref AWS::NoValue]
          API_VERSION: !If [HasApiVersion, !Ref ApiVersion, !Ref AWS::NoValue]
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          TRUST_CLOUDFRONT: "true"

  ApiWebEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Properties:
      FunctionName: elixir-drop-web-api
      EndpointName: production
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !GetAtt ApiWebRevision.RevisionId
          Weight: 100
      ScalingConfig:
        MaxEnvironments: 3
      ThrottleConfig:
        RateLimit: 100

  RefreshDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub ${AWS::StackName}-refresh-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  RefreshQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub ${AWS::StackName}-refresh.fifo
      FifoQueue: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 720
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RefreshDeadLetterQueue.Arn
        maxReceiveCount: 5

  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /elixir-drop/refresh
      RetentionInDays: 30

  RefreshRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-refresh-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: refresh-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RefreshLogGroup.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RefreshQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub "${DataTable.Arn}/index/*"

  RefreshFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-refresh
      Description: Refresh cached hub data outside player requests
      Architectures:
        - arm64
      Runtime: nodejs24.x
      Handler: refresh-worker.refreshHandler
      Role: !GetAtt RefreshRole.Arn
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref RefreshLogGroup
        SystemLogLevel: INFO
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          ELIXIR_INTEGRATION_KEY: !Ref ElixirIntegrationKey
          ELIXIR_MCP_KEY: !Ref ElixirMcpKey
          ELIXIR_MCP_BASE_URL: !Ref ElixirMcpBaseUrl

  RefreshEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RefreshQueue.Arn
      FunctionName: !Ref RefreshFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 2

  RefreshDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-refresh-dlq
      AlarmDescription: Background refresh exhausted its retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RefreshDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  RefreshAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-refresh-age
      AlarmDescription: Background refresh is delayed for more than fifteen minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RefreshQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrResultFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: elixir-drop-cr-results
      Description: Applies retained manual season-repair commands
      Architectures:
        - arm64
      Runtime: nodejs24.x
      Handler: cr-results.crResultHandler
      Role: !GetAtt CrResultRole.Arn
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 5
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref CrResultLogGroup
        SystemLogLevel: INFO
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          SESSION_SECRET: !Ref SessionSecret
          # The result consumer does not write referee evidence, but it calls the
          # shared getConfig(), which requires TELEMETRY_PEPPER. Present here only
          # to satisfy that shared config; still Lambda-only, never exported.
          TELEMETRY_PEPPER: !Ref TelemetryPepper
          APP_URL: !Ref AppUrl
          NAME_MODEL_ID: !Ref NameModelId
          ELIXIR_INTEGRATION_KEY: !Ref ElixirIntegrationKey
          ELIXIR_MCP_KEY: !Ref ElixirMcpKey
          ELIXIR_MCP_BASE_URL: !Ref ElixirMcpBaseUrl

  CrResultEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CrResultQueue.Arn
      FunctionName: !Ref CrResultFunction
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ApiFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-errors
      AlarmDescription: Elixir Drop API returned one or more HTTP 5xx responses.
      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX
      Dimensions:
        - Name: FunctionName
          Value: elixir-drop-web-api
        - Name: EndpointName
          Value: production
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  WebDistributionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-drop-web-5xx-rate
      AlarmDescription: CloudFront returned more than 5% 5xx responses in two of three five-minute windows.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref WebDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiLatencyP95Alarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-latency-p95
      AlarmDescription: Elixir Drop API p95 response latency exceeded 1.2 seconds in five of fifteen one-minute windows.
      Namespace: ElixirDrop/HTTP
      MetricName: RequestLatency
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 15
      DatapointsToAlarm: 5
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiLatencyP99Alarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-latency-p99
      AlarmDescription: Elixir Drop API p99 response latency exceeded 2 seconds in two of three five-minute windows.
      Namespace: ElixirDrop/HTTP
      MetricName: RequestLatency
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiFunctionConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-concurrency
      AlarmDescription: Elixir Drop HTTP EndpointActiveEnvironments.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironments
      Dimensions:
        - Name: FunctionName
          Value: elixir-drop-web-api
        - Name: EndpointName
          Value: production
        - Name: ExecutionRegion
          Value: !Ref AWS::Region
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DataTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-dynamodb-throttles
      AlarmDescription: Elixir Drop DynamoDB reads or writes were throttled in two of three minutes.
      Metrics:
        - Id: readthrottles
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: writethrottles
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: throttles
          Expression: readthrottles + writethrottles
          Label: DynamoDB throttle events
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DataTableSystemErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-dynamodb-system-errors
      AlarmDescription: DynamoDB returned service errors for Elixir Drop in two of three minutes.
      Metrics:
        - Id: batchget
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: BatchGetItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: batchwrite
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: BatchWriteItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: deleteitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: DeleteItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: getitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: GetItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: putitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: PutItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: query
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: Query
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: transactwrite
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: TransactWriteItems
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: updateitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref DataTable
                - Name: Operation
                  Value: UpdateItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: systemerrors
          Expression: SUM(METRICS())
          Label: DynamoDB system errors
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-api-throttles
      AlarmDescription: Elixir Drop HTTP endpoint or account capacity was throttled.
      Metrics:
        - Id: throttles
          Expression: SUM(METRICS())
          ReturnData: true
        - Id: throttle0
          MetricStat:
            Metric:
              Namespace: AWS/Lambda/Web/Usage
              MetricName: EndpointRequestThrottles
              Dimensions:
                - Name: FunctionName
                  Value: elixir-drop-web-api
                - Name: EndpointName
                  Value: production
                - Name: ExecutionRegion
                  Value: !Ref AWS::Region
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: throttle1
          MetricStat:
            Metric:
              Namespace: AWS/Lambda/Web/Usage
              MetricName: EndpointActiveEnvironmentThrottles
              Dimensions:
                - Name: FunctionName
                  Value: elixir-drop-web-api
                - Name: EndpointName
                  Value: production
                - Name: ExecutionRegion
                  Value: !Ref AWS::Region
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: throttle2
          MetricStat:
            Metric:
              Namespace: AWS/Lambda/Web/Usage
              MetricName: AccountRequestThrottles
              Dimensions:
                - Name: FunctionName
                  Value: elixir-drop-web-api
                - Name: EndpointName
                  Value: production
                - Name: ExecutionRegion
                  Value: !Ref AWS::Region
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: throttle3
          MetricStat:
            Metric:
              Namespace: AWS/Lambda/Web/Usage
              MetricName: AccountActiveVCPUArm64Throttles
              Dimensions:
                - Name: FunctionName
                  Value: elixir-drop-web-api
                - Name: EndpointName
                  Value: production
                - Name: ExecutionRegion
                  Value: !Ref AWS::Region
            Period: 60
            Stat: Sum
          ReturnData: false
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrResultFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-cr-result-errors
      AlarmDescription: The Clash Royale result consumer returned one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CrResultFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CrResultDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmTopic
    Properties:
      AlarmName: elixir-drop-cr-result-dlq
      AlarmDescription: A season-repair command reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CrResultDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    DependsOn: CloudFormationDashboardPolicy
    Properties:
      DashboardName: elixir-drop-operations
      DashboardBody: !Sub |
        {"start": "-PT8H", "periodOverride": "inherit", "widgets": [{"type": "alarm", "x": 0, "y": 0, "width": 24, "height": 5, "properties": {"title": "Elixir Drop service alarms", "sortBy": "stateUpdatedTimestamp", "alarms": ["${WebDistributionErrorAlarm.Arn}", "${ApiFunctionErrorAlarm.Arn}", "${ApiFunctionThrottleAlarm.Arn}", "${ApiLatencyP95Alarm.Arn}", "${ApiLatencyP99Alarm.Arn}", "${ApiFunctionConcurrencyAlarm.Arn}", "${DataTableThrottleAlarm.Arn}", "${DataTableSystemErrorAlarm.Arn}"]}}, {"type": "metric", "x": 0, "y": 5, "width": 12, "height": 6, "properties": {"title": "API requests and responses", "region": "${AWS::Region}", "period": 300, "stat": "Sum", "metrics": [["AWS/Lambda/Web", "ExecutedRequests", "FunctionName", "elixir-drop-web-api", "EndpointName", "production"], [".", "HTTPResponseStatusClass4XX", ".", ".", ".", "."], [".", "HTTPResponseStatusClass5XX", ".", ".", ".", "."]]}}, {"type": "metric", "x": 12, "y": 5, "width": 12, "height": 6, "properties": {"title": "API response latency", "region": "${AWS::Region}", "period": 300, "metrics": [["ElixirDrop/HTTP", "RequestLatency", {"stat": "p50"}], [".", ".", {"stat": "p95"}], [".", ".", {"stat": "p99"}]]}}, {"type": "log", "x": 0, "y": 11, "width": 24, "height": 7, "properties": {"title": "Requests and p95 by HTTP route", "region": "${AWS::Region}", "view": "table", "query": "SOURCE '/elixir-drop/api' | fields message.route, message.elapsedMs | filter message.event = 'api.timings' | stats count(*) as requests, pct(message.elapsedMs, 95) as p95 by message.route"}}, {"type": "metric", "x": 0, "y": 18, "width": 24, "height": 7, "properties": {"title": "HTTP environment CPU and active time", "region": "${AWS::Region}", "period": 300, "view": "timeSeries", "stacked": false, "metrics": [["AWS/Lambda/Web", "EnvironmentCPUTime", "FunctionName", "elixir-drop-web-api"], [".", "EnvironmentActiveTime", ".", "."]]}}, {"type": "metric", "x": 0, "y": 25, "width": 12, "height": 6, "properties": {"title": "HTTP endpoint limits", "region": "${AWS::Region}", "period": 300, "stat": "Sum", "metrics": [["AWS/Lambda/Web/Usage", "EndpointRequestThrottles", "FunctionName", "elixir-drop-web-api", "EndpointName", "production", "ExecutionRegion", "${AWS::Region}"], [".", "EndpointActiveEnvironmentThrottles", ".", ".", ".", ".", ".", "."]]}}, {"type": "metric", "x": 12, "y": 25, "width": 12, "height": 6, "properties": {"title": "HTTP memory and concurrency", "region": "${AWS::Region}", "period": 300, "metrics": [["AWS/Lambda/Web", "EnvironmentMaxMemoryUsage", "FunctionName", "elixir-drop-web-api", {"stat": "Maximum"}], [".", "EnvironmentConcurrentRequests", ".", ".", {"stat": "Maximum", "yAxis": "right"}]]}}, {"type": "metric", "x": 0, "y": 31, "width": 12, "height": 6, "properties": {"title": "DynamoDB consumed capacity", "region": "${AWS::Region}", "period": 300, "stat": "Sum", "metrics": [["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DataTable}", {"label": "Read units"}], [".", "ConsumedWriteCapacityUnits", ".", ".", {"label": "Write units"}]]}}, {"type": "metric", "x": 12, "y": 31, "width": 12, "height": 6, "properties": {"title": "DynamoDB failures", "region": "${AWS::Region}", "period": 60, "stat": "Sum", "metrics": [["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${DataTable}", {"label": "Read throttles"}], [".", "WriteThrottleEvents", ".", ".", {"label": "Write throttles"}], [".", "SystemErrors", ".", ".", "Operation", "GetItem", {"label": "Get errors"}], [".", ".", ".", ".", ".", "Query", {"label": "Query errors"}], [".", ".", ".", ".", ".", "UpdateItem", {"label": "Update errors"}], [".", ".", ".", ".", ".", "TransactWriteItems", {"label": "Transaction errors"}]]}}, {"type": "metric", "x": 0, "y": 37, "width": 12, "height": 6, "properties": {"title": "Web requests and bytes", "region": "us-east-1", "period": 300, "stat": "Sum", "metrics": [["AWS/CloudFront", "Requests", "DistributionId", "${WebDistribution}", "Region", "Global", {"label": "Requests"}], [".", "BytesDownloaded", ".", ".", ".", ".", {"label": "Bytes", "yAxis": "right"}]]}}, {"type": "metric", "x": 12, "y": 37, "width": 12, "height": 6, "properties": {"title": "Web error rate", "region": "us-east-1", "period": 300, "stat": "Average", "yAxis": {"left": {"label": "Percent", "showUnits": false}}, "metrics": [["AWS/CloudFront", "TotalErrorRate", "DistributionId", "${WebDistribution}", "Region", "Global", {"label": "Total"}], [".", "4xxErrorRate", ".", ".", ".", ".", {"label": "4xx"}], [".", "5xxErrorRate", ".", ".", ".", ".", {"label": "5xx"}]]}}]}

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub elixir-drop-web-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Permanent derived preview images live outside WebBucket so the static web
  # deploy's mirror-and-delete step can never remove a player's published run.
  # Versioning is intentionally omitted: account deletion must remove the
  # derived image itself, not leave a retained object version behind.
  ShareAssetBucket:
    Type: AWS::S3::Bucket
    DependsOn: CloudFormationShareAssetPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub elixir-drop-share-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Private access from the Elixir Drop distribution to its web bucket
        Name: elixir-drop-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: elixir-drop-request-router
      AutoPublish: true
      FunctionConfig:
        Comment: Classify requests, route clean shares, strip the API prefix, and resolve static directory indexes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        import cf from 'cloudfront';

        function requestClass(uri) {
          if (uri.indexOf('/api/') === 0) return 'api';
          if (uri.indexOf('/share-assets/') === 0) return 'share-asset';
          if (uri.indexOf('/share/') === 0) return 'share-page';
          if (uri === '/auth' || uri === '/auth/') return 'web-auth-recovery';
          if (uri === '/' || uri === '/index.html') return 'web-home';

          var pageClasses = {
            '/about/': 'web-page-about',
            '/badges/': 'web-page-badges',
            '/discord/': 'web-page-discord',
            '/elixir-costs/': 'web-page-elixir-costs',
            '/faq/': 'web-page-faq',
            '/fair-play/': 'web-page-fair-play',
            '/games/': 'web-page-games',
            '/install/': 'web-page-install',
            '/learn-elixir-costs/': 'web-page-learn-elixir-costs',
            '/privacy/': 'web-page-privacy',
            '/updates/': 'web-page-updates',
            '/xp/': 'web-page-xp'
          };
          var pageUri = uri.replace(/index\.html$/, '');
          if (pageClasses[pageUri]) return pageClasses[pageUri];
          if (uri.indexOf('/assets/') === 0) return 'web-asset';
          if (uri.indexOf('/cards/') === 0) return 'web-card-art';
          if (uri === '/card-art-sw.js') return 'web-service-worker';
          if (uri === '/site.webmanifest') return 'web-manifest';
          if (uri === '/api-config.json' || uri === '/version.json') return 'web-config';
          if (uri === '/feed.xml' || uri === '/robots.txt' || uri === '/sitemap.xml') return 'web-discovery';
          return 'web-other';
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          cf.logCustomData(requestClass(uri));
          // Some desktop mail clients strip a URL fragment while opening the
          // magic link. Recover the resulting clean path at the edge so the
          // private S3 origin never sees a missing /auth object, and move the
          // token back into the fragment before the app loads.
          if (uri === '/auth' || uri === '/auth/') {
            var query = request.rawQueryString();
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: {
                'cache-control': { value: 'no-store' },
                'location': { value: '/#/auth' + (query === undefined ? '' : '?' + query) }
              }
            };
          }
          if (uri.indexOf('/api/') === 0 || uri.indexOf('/share/') === 0 || uri.indexOf('/share-assets/') === 0 || uri.indexOf('/updates/') === 0 || uri === '/feed.xml') {
            request.headers['x-elixir-drop-viewer-ip'] = { value: event.viewer.ip };
          }
          if (uri.indexOf('/api/') === 0) {
            request.uri = uri.slice(4) || '/';
            return request;
          }
          if (uri === '/updates/' || uri === '/updates/index.html') {
            request.uri = '/updates/archive';
            return request;
          }
          if (uri.indexOf('/share/') === 0 || uri.indexOf('/share-assets/') === 0 || uri.indexOf('/updates/') === 0 || uri === '/feed.xml') return request;
          if (uri === '/') {
            request.uri = '/index.html';
          } else if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: elixir-drop-static
        Comment: Honor web asset cache headers without varying on viewer state
        DefaultTTL: 3600
        MinTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - drop.poapkings.com
        CacheBehaviors:
          - PathPattern: /updates/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref PublicApiCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: e61eb60c-9c35-4d20-a928-2b84e02af89c
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /feed.xml
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref PublicApiCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: e61eb60c-9c35-4d20-a928-2b84e02af89c
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /share-assets/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref ApiCachePolicy
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /share/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref ApiCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /api/*
            TargetOriginId: api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref ApiCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebRequestFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
        Comment: Elixir Drop website and same-origin API
        DefaultCacheBehavior:
          TargetOriginId: web
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref WebCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebRequestFunction.FunctionARN
          ResponseHeadersPolicyId: e61eb60c-9c35-4d20-a928-2b84e02af89c
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !GetAtt ApiWebEndpoint.DomainName
            OriginAccessControlId: !Ref ApiOriginAccessControl
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref WebCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  WebAccessLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: elixir-drop-web-access
      LogType: ACCESS_LOGS
      ResourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebAccessLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: elixir-drop-web-access
      DestinationResourceArn: !GetAtt WebAccessLogGroup.Arn
      OutputFormat: json

  WebAccessLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn: WebAccessLogDeliverySource
    Properties:
      DeliverySourceName: elixir-drop-web-access
      DeliveryDestinationArn: !GetAtt WebAccessLogDeliveryDestination.Arn
      RecordFields:
        - "timestamp(ms)"
        - x-edge-location
        - cs-method
        - sc-status
        - sc-bytes
        - x-edge-result-type
        - x-edge-response-result-type
        - x-edge-detailed-result-type
        - time-taken
        - time-to-first-byte
        - sc-content-type
        - cache-behavior-path-pattern
        - viewer-request-log-data

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Value: !Sub "${AppUrl}/api"
  ApiOriginDomain:
    Value: !GetAtt ApiWebEndpoint.DomainName
  ApiRevisionId:
    Value: !GetAtt ApiWebRevision.RevisionId
  TableName:
    Value: !Ref DataTable
  FunctionName:
    Value: elixir-drop-web-api
  WebBucketName:
    Value: !Ref WebBucket
  ShareAssetBucketName:
    Value: !Ref ShareAssetBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  WebDistributionDomainName:
    Value: !GetAtt WebDistribution.DomainName
  WebAccessLogGroupName:
    Value: !Ref WebAccessLogGroup
  CrResultQueueUrl:
    Value: !Ref CrResultQueue
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  RefereeReadRoleArn:
    Value: !GetAtt RefereeReadRole.Arn
    Description: Bounded referee role for evidence reads and REFEREE# decision writes.
  RunReportsRoleArn:
    Value: !GetAtt RunReportsRole.Arn
    Description: Bounded Run Drop role for identity-free failure-report triage.
  DropControlRoleArn:
    Value: !GetAtt DropControlRole.Arn
    Description: Tailnet-only account support role with audited public-profile corrections.
  LeaderboardMaintenanceRoleArn:
    Value: !GetAtt LeaderboardMaintenanceRole.Arn
    Description: Bounded role for sparse leaderboard projection repair.
