version = 2
repo = "."
timezone = "America/Chicago"

# Approved September 9, 2026; renamed, moved to one worktree per run and
# resumed September 29, 2026 at the cadences already installed in Codex (the
# weekend Drop Growth Manager slot has been paused since September 17 and
# stays so). Calendar starts use local Chicago time.
# schedule_of entries share the original objective, lease key, and automation memory.
# Interval activities use an initial prompt date check because the installed app
# miscalculates interval timezones. Preserve that check when reinstalling.
# Each run gets its own git worktree (execution_environment = "worktree"),
# prepared by local_environment_config_path; the installed automation takes
# that path absolute, from the main checkout. launch_cwd records the app
# launch directory relative to the main checkout.
# Event-driven follow-ups remain explicit starts; these are calendar schedules.

[[automation]]
id = "drop-operations-manager"
name = "Drop Operator"
objective = "run"
objective_file = "AGENT-TEAM/drop-operator.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYDAY=WE,SA;BYHOUR=4;BYMINUTE=30"
model = "gpt-5.6-sol"
reasoning_effort = "high"
execution_environment = "worktree"
local_environment_config_path = ".codex/environments/environment.toml"
launch_cwd = "."
prompt = "Follow the project instructions already loaded by Codex. This run has its own git worktree of drop.poapkings.com, prepared at a fresh origin/main by the repository's Codex environment; every path is relative to it. Read `AGENT-TEAM/WORKFLOW.md`, `AGENT-TEAM/README.md`, `AGENT-TEAM/drop-operator.md` completely, then pursue the `run` objective (Drop Operator) exactly as written. Measure current evidence before changing anything. Own a clear gap through source fix, regression coverage, verification, deployment or restart when required, and natural acceptance. Use issues only for multi-run work, external blockers, durable audits, or Jamie decisions. Run `AGENT-TEAM/scripts/preflight.sh` first. Edit only in this worktree, on a `run/<slug>` branch, and land every change as a pull request that merges on a green `validate`; main takes nothing else, and the merge deploys. Claim the `run` lease (`node AGENT-TEAM/scripts/objective-lease.mjs`) only immediately before a production write outside that pipeline (an out-of-band deploy, a referee decision, a run-report triage, or an Updates publication), release it once the write is verified, and never clear or break another holder's lease. This worktree is discarded after the run: before ending, everything worth keeping is merged or in an open pull request. Never publish pre-existing work; preserve human and privacy boundaries. Keep automation memory to Current state, Active watches, and one replace-in-place Latest run."

