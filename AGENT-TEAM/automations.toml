version = 2
repo = "."
timezone = "America/Chicago"

# Stable ids preserve Codex task history. Daily cadences keep this hobby project
# observed without introducing an hourly operations loop.

[[automation]]
id = "drop-operations-manager"
name = "Run Drop"
objective = "run"
objective_file = "AGENT-TEAM/run-drop.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=10;BYMINUTE=30"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"

[[automation]]
id = "drop-growth-and-season-analyst"
name = "Grow Drop"
objective = "grow"
objective_file = "AGENT-TEAM/grow-drop.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=12;BYMINUTE=30"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"

[[automation]]
id = "drop-fair-play-referee"
name = "Protect Fair Play"
objective = "fair-play"
objective_file = "AGENT-TEAM/protect-fair-play.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=18;BYMINUTE=30"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
