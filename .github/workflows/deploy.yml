name: Build and Deploy

# CI holds no AWS key (2026-09-26): the promotion job runs in the
# `production` environment (main only, no admin bypass) and assumes
# elixir-drop-github-deploy with GitHub's OIDC token; the role trusts this
# repository's production environment and nothing else. The elixir-drop
# user keeps only the Control Room's referee grant.

on:
  workflow_run:
    workflows: ["Validate Main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# A deployment already updating CloudFormation or CloudFront is allowed to finish.
# A newer successful validation waits, then rechecks that its SHA is still main
# before changing production. GitHub keeps only the newest pending run here.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  scope:
    name: Confirm validated release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      browser: ${{ steps.classify.outputs.browser }}
      deploy_api: ${{ steps.classify.outputs.deploy_api }}
      deploy_web: ${{ steps.classify.outputs.deploy_web }}
      head_sha: ${{ steps.head.outputs.sha }}
      latest: ${{ steps.latest.outputs.latest }}
      ships: ${{ steps.classify.outputs.ships }}
    steps:
      # A manual run deploys only main, and only a SHA Validate Main passed.
      - id: head
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::only main deploys; ${GITHUB_REF} was dispatched"
              exit 1
            fi
            passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-main.yml/runs" -f head_sha="${GITHUB_SHA}" -f status=success --jq .total_count)
            if [ "$passed" -eq 0 ]; then
              echo "::error::Validate Main has not passed on ${GITHUB_SHA}; nothing deployed"
              exit 1
            fi
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${VALIDATED_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 2

      - name: Download validated scope
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-scope
          path: ${{ runner.temp }}/ci-scope
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - id: classify
        name: Read validated scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/classify-ci-scope.mjs --all --github-output "$GITHUB_OUTPUT"
          else
            scope_file="${RUNNER_TEMP}/ci-scope/ci-scope.json"
            test -f "$scope_file"
            echo "Validated scope:"
            jq . "$scope_file"
            {
              echo "browser=$(jq -r .browser "$scope_file")"
              echo "deploy_api=$(jq -r .deployApi "$scope_file")"
              echo "deploy_web=$(jq -r .deployWeb "$scope_file")"
              echo "ships=$(jq -r .ships "$scope_file")"
            } >> "$GITHUB_OUTPUT"
          fi

      - id: latest
        name: Require the current main SHA
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          validated_sha=$(git rev-parse HEAD)
          if [ "$remote_sha" = "$validated_sha" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "Validated ${validated_sha} was superseded by ${remote_sha}; skipping this deployment."
            echo "latest=false" >> "$GITHUB_OUTPUT"
            # This is expected when main advances while a validated release is
            # waiting for the production lock. Leave the run green; the false
            # output skips promotion and prevents a production marker.
          fi

  build:
    name: Promote validated surfaces
    needs: scope
    if: needs.scope.outputs.latest == 'true' && needs.scope.outputs.ships == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.scope.outputs.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ELIXIR_DROP_DEPLOY_ROLE_ARN }}
          role-session-name: elixir-drop-deploy-${{ github.run_id }}
          aws-region: ${{ vars.ELIXIR_DROP_AWS_REGION }}

      - name: Deploy API
        if: needs.scope.outputs.deploy_api == 'true'
        run: npm run deploy:api
        env:
          AWS_REGION: ${{ vars.ELIXIR_DROP_AWS_REGION }}
          ELIXIR_DROP_CFN_ROLE_ARN: ${{ vars.ELIXIR_DROP_CFN_ROLE_ARN }}
          ELIXIR_DROP_CODE_BUCKET: ${{ vars.ELIXIR_DROP_CODE_BUCKET }}
          ELIXIR_DROP_STACK_NAME: ${{ vars.ELIXIR_DROP_STACK_NAME }}
          ELIXIR_DROP_WEB_CERTIFICATE_ARN: ${{ vars.ELIXIR_DROP_WEB_CERTIFICATE_ARN }}
          ELIXIR_DROP_WEB_ORIGIN_TOKEN: ${{ secrets.ELIXIR_DROP_WEB_ORIGIN_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.ELIXIR_DROP_BUTTONDOWN_API_KEY }}
          BUTTONDOWN_NEWSLETTER_ID: ${{ secrets.ELIXIR_DROP_BUTTONDOWN_NEWSLETTER_ID }}
          APP_URL: https://drop.poapkings.com
          # A web release advances the referee evidence boundary. API-only
          # releases preserve the deployed value through UsePreviousValue.
          WEB_VERSION: ${{ needs.scope.outputs.deploy_web == 'true' && needs.scope.outputs.head_sha || '' }}

      # Mail is SES (2026-09-17); `npm run check:beta` owns live mail
      # verification.
      - name: Verify deployed API
        if: needs.scope.outputs.deploy_api == 'true'
        run: npm run smoke:api
        env:
          AWS_REGION: ${{ vars.ELIXIR_DROP_AWS_REGION }}
          ELIXIR_DROP_STACK_NAME: ${{ vars.ELIXIR_DROP_STACK_NAME }}

      # deploy:api writes the stack's endpoint to api-config.json. A web release
      # deliberately passes through the API first so its referee version and
      # the web bundle retain one production boundary.
      - name: Build website with deployed API configuration
        if: needs.scope.outputs.deploy_web == 'true'
        run: npm run build --workspace=@elixir-drop/web

      # deploy:web changes the build's API config to the same-origin /api route,
      # uploads it to private S3, invalidates CloudFront, and smokes the
      # distribution hostname.
      - name: Publish website to AWS
        if: needs.scope.outputs.deploy_web == 'true'
        run: npm run deploy:web
        env:
          AWS_REGION: ${{ vars.ELIXIR_DROP_AWS_REGION }}
          ELIXIR_DROP_STACK_NAME: ${{ vars.ELIXIR_DROP_STACK_NAME }}

  mark:
    name: Record production head
    needs: [scope, build]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.latest == 'true' &&
      (
        needs.scope.outputs.ships != 'true' ||
        needs.build.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write production marker
        env:
          PRODUCTION_SHA: ${{ needs.scope.outputs.head_sha }}
        run: echo "$PRODUCTION_SHA" > "${RUNNER_TEMP}/production-head"

      # Validation reads the SHA from the artifact name. Only this final job can
      # create one, so a failed, skipped, or superseded promotion never advances
      # the cumulative production baseline.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-head-${{ needs.scope.outputs.head_sha }}
          path: ${{ runner.temp }}/production-head
          retention-days: 90
