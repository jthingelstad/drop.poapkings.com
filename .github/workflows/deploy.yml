name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Non-browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run verify:non-browser

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: iphone-14
            browser: webkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm run test:e2e --workspace=@elixir-drop/web -- --project=${{ matrix.project }}

      - name: Upload Playwright report (${{ matrix.project }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build and deploy
    needs: [verify, browser]
    runs-on: ubuntu-latest
    # Verification is complete before this job starts. The UpdateStack wait in
    # infra/scripts/deploy.mjs can still take up to 1200s, so leave enough room
    # for that operation plus the API smoke and final website build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Deploy API
        run: npm run deploy:api
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ELIXIR_DROP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ELIXIR_DROP_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ELIXIR_DROP_AWS_REGION }}
          ELIXIR_DROP_CFN_ROLE_ARN: ${{ vars.ELIXIR_DROP_CFN_ROLE_ARN }}
          ELIXIR_DROP_CODE_BUCKET: ${{ vars.ELIXIR_DROP_CODE_BUCKET }}
          ELIXIR_DROP_STACK_NAME: ${{ vars.ELIXIR_DROP_STACK_NAME }}
          # Buttondown enrollment credentials. Passed here so CI is the
          # authoritative source of the value; without them the deploy relies on
          # UsePreviousValue and a manual seed. Empty/unset is tolerated by
          # parameters.mjs (falls back to UsePreviousValue on an existing stack).
          BUTTONDOWN_API_KEY: ${{ secrets.ELIXIR_DROP_BUTTONDOWN_API_KEY }}
          BUTTONDOWN_NEWSLETTER_ID: ${{ secrets.ELIXIR_DROP_BUTTONDOWN_NEWSLETTER_ID }}
          APP_URL: https://drop.poapkings.com
          # The API reports this so stale browser tabs can prompt a reload. It is
          # the same commit the web bundle is built from below (GITHUB_SHA), and
          # the front-end build id is its first 12 chars.
          WEB_VERSION: ${{ github.sha }}

      # The Fastmail token deliberately stays out of GitHub: the smoke script
      # reports its JMAP probe as "not checked" here, and the operator-side
      # `npm run check:beta` covers live mail verification from the fixed host.
      - name: Verify deployed API
        run: npm run smoke:api
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ELIXIR_DROP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ELIXIR_DROP_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ELIXIR_DROP_AWS_REGION }}
          ELIXIR_DROP_STACK_NAME: ${{ vars.ELIXIR_DROP_STACK_NAME }}

      # The API deploy writes api-config.json; rebuild so Pages contains the
      # endpoint emitted by the stack that was just promoted.
      - name: Build website with deployed API configuration
        run: npm run build --workspace=@elixir-drop/web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages normally publishes quickly, but its deployment service can spend
    # more than ten minutes processing an otherwise healthy artifact. Keep the
    # job and action ceilings aligned so the runner does not cancel it first.
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000

      - name: Verify deployed website
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://drop.poapkings.com/ | grep -q "Elixir Drop"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://drop.poapkings.com/api-config.json | grep -q "apiBaseUrl"
