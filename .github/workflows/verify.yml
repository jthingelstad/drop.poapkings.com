name: Verify

# Pull requests get the same checks as the deploy gate, split into one
# non-browser job and four parallel Playwright projects. No secrets are exposed,
# so the workflow is fork-safe by construction. Deployment still happens only
# on push to main, where deploy.yml requires the same five verification lanes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Non-browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run verify:non-browser

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: iphone-14
            browser: webkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm run test:e2e --workspace=@elixir-drop/web -- --project=${{ matrix.project }}

      - name: Upload Playwright report (${{ matrix.project }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
