name: Verify

# Pull requests and the scheduled regression run get the exhaustive four-engine
# matrix. Main's deployment gate is intentionally faster: full Chromium split
# across two shards plus tagged cross-browser smoke, with this workflow serving
# as the daily backstop for the combinations that do not need to block a push.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Non-browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run verify:non-browser

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    # The version-matched image carries Playwright's browsers and Linux
    # dependencies, so the daily backstop never waits on the runner's apt mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            secondary_project: ""
            browser: chromium
          - project: firefox
            secondary_project: ""
            browser: firefox
          - project: webkit
            secondary_project: iphone-14
            browser: webkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run test:e2e --workspace=@elixir-drop/web -- --project=${{ matrix.project }}

      - name: Run secondary browser project
        if: matrix.secondary_project != ''
        run: npm run test:e2e --workspace=@elixir-drop/web -- --project=${{ matrix.secondary_project }}

      - name: Upload Playwright report (${{ matrix.project }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
