name: Verify

# Pull requests and the scheduled regression run get the exhaustive four-engine
# matrix. Main's deployment gate is intentionally faster: full Chromium split
# across two shards plus tagged cross-browser smoke, with this workflow serving
# as the daily backstop for the combinations that do not need to block a push.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Non-browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run verify:non-browser

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Match main validation: hosted-runner mirror fallback can consume most of
    # the old 15-minute window before Playwright reaches the project tests.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: iphone-14
            browser: webkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm run test:e2e --workspace=@elixir-drop/web -- --project=${{ matrix.project }}

      - name: Upload Playwright report (${{ matrix.project }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
