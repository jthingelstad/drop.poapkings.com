version: 2
# One grouped PR keeps routine bumps to a handful a week instead of one each;
# every Dependabot PR lands through the same `validate` check as any other.
updates:
  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
